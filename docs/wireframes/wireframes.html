<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CampusBites Wireframes</title>
<style>
  :root { --ink:#333; --mid:#888; --soft:#d9d9d9; --fill:#efefef; --note:#c2410c; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-family:"Segoe Print","Comic Sans MS",cursive; }
  .screen { width:1400px; padding:28px 36px; page-break-after:always; }
  .screen h2 { margin:0 0 4px; font-size:26px; }
  .screen .sub { margin:0 0 18px; color:var(--mid); font-size:15px; }
  .row { display:flex; gap:28px; align-items:flex-start; }
  .frame { width:1000px; border:3px solid var(--ink); border-radius:10px; overflow:hidden; background:#fff; position:relative; }
  .notes { width:300px; margin:0; padding:16px 16px 16px 38px; border:2px dashed var(--note); border-radius:10px; color:var(--note); font-size:14px; line-height:1.45; }
  .notes li { margin-bottom:8px; }
  .notes h4 { margin:0 0 8px -22px; font-size:16px; }
  .mk { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--note); color:#fff; font-size:13px; font-family:Arial,sans-serif; font-weight:bold; flex-shrink:0; }
  .p { padding:20px 28px; }
  .nav { display:flex; align-items:center; justify-content:space-between; padding:12px 24px; border-bottom:2px solid var(--ink); }
  .nav .logo { display:flex; gap:8px; align-items:center; font-weight:bold; font-size:18px; }
  .nav .links { display:flex; gap:26px; }
  .nav .right { display:flex; gap:12px; align-items:center; }
  .logo-box { width:30px; height:30px; border:2px solid var(--ink); border-radius:6px; }
  .img { border:2px solid var(--mid); border-radius:8px; background:
      linear-gradient(to top right, transparent calc(50% - 1px), var(--mid) 50%, transparent calc(50% + 1px)),
      linear-gradient(to top left, transparent calc(50% - 1px), var(--mid) 50%, transparent calc(50% + 1px)), var(--fill); }
  .ln { height:12px; background:var(--soft); border-radius:6px; margin:7px 0; }
  .ln.dark { background:#aaa; height:18px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:8px 18px; border:2px solid var(--ink); border-radius:8px; font-size:15px; white-space:nowrap; }
  .btn.pri { background:var(--ink); color:#fff; }
  .btn.sm { padding:4px 12px; font-size:13px; }
  .pill { display:inline-block; padding:4px 14px; border:2px solid var(--mid); border-radius:20px; font-size:13px; margin:0 6px 6px 0; }
  .pill.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .badge { display:inline-block; padding:1px 9px; border:1.5px solid var(--mid); border-radius:12px; font-size:11px; margin-right:4px; }
  .box { border:2px solid var(--ink); border-radius:10px; padding:14px; }
  .input { border:2px solid var(--mid); border-radius:7px; padding:8px 10px; color:var(--mid); font-size:14px; }
  .lbl { font-size:13px; margin:8px 0 3px; }
  .grid { display:grid; gap:14px; }
  .g3 { grid-template-columns:repeat(3,1fr); } .g4 { grid-template-columns:repeat(4,1fr); }
  .flex { display:flex; gap:12px; align-items:center; }
  .between { justify-content:space-between; }
  .h { font-weight:bold; font-size:20px; margin:16px 0 10px; }
  .foot { border-top:2px solid var(--ink); padding:12px 24px; color:var(--mid); font-size:13px; display:flex; justify-content:space-between; }
  .stepper { display:inline-flex; border:2px solid var(--ink); border-radius:7px; font-size:14px; }
  .stepper span { padding:3px 10px; }
  .overlay { position:absolute; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .modal { width:420px; background:#fff; border:3px solid var(--ink); border-radius:12px; padding:20px; }
  .tracker { display:flex; align-items:center; justify-content:center; gap:0; margin:18px 0; }
  .dot { width:40px; height:40px; border:3px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; }
  .dot.done { background:var(--ink); color:#fff; }
  .bar { width:170px; height:5px; background:var(--soft); }
  .bar.done { background:var(--ink); }
  .flowbox { position:absolute; width:190px; padding:14px 10px; text-align:center; border:3px solid var(--ink); border-radius:10px; background:#fff; font-size:15px; }
  .flowbox small { display:block; color:var(--mid); font-size:12px; }
  .decision { border-style:dashed; border-color:var(--note); color:var(--note); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const nav = (active="") => `
  <div class="nav">
    <div class="logo"><div class="logo-box"></div>CampusBites <span class="mk">1</span></div>
    <div class="links"><span style="${active==='menu'?'text-decoration:underline':''}">Menu</span><span style="${active==='orders'?'text-decoration:underline':''}">My Orders</span></div>
    <div class="right"><span class="btn sm">[cart] 2</span> <span class="mk">2</span><span class="btn sm pri">Login</span></div>
  </div>`;
const foot = `<div class="foot"><span>[logo] CampusBites — skip the canteen queue</span><span>Milestone-1 MVP</span></div>`;
const img = (h, w="100%") => `<div class="img" style="height:${h}px;width:${w}"></div>`;
const ln = (w, cls="") => `<div class="ln ${cls}" style="width:${w}"></div>`;
const itemCard = (state="add") => `
  <div class="box" style="padding:10px">
    ${img(90)}
    <div class="flex between" style="margin-top:8px"><b style="font-size:14px">Dish name</b><b style="font-size:14px">₹ price</b></div>
    ${ln("60%")}
    <div><span class="badge">Veg</span><span class="badge">10 min</span><span class="badge">Popular</span></div>
    <div style="margin-top:8px">${
      state==="add" ? `<span class="btn sm" style="width:100%">+ Add</span>` :
      state==="qty" ? `<span class="stepper"><span>−</span><span>2</span><span>+</span></span>` :
      `<span class="badge">Sold out</span>`}</div>
  </div>`;

const screens = [
{ id:"01-landing", h:1230, title:"1. Landing page", route:"/", sub:"First screen a student sees. Explains the product in 5 seconds and gets them to the menu.",
  notes:["Logo → always goes home","Cart icon shows item count (from CartContext)","Hero: headline + one-line pitch","Main CTA “Order now” → /menu. Secondary “Login”","How it works: 3 steps (Browse → Order ahead → Skip queue)","Canteens: name, location, timings, Open/Closed badge","Popular dishes: reusable MenuItemCard, can add to cart right here"],
  body:`${nav()}
  <div class="p">
    <div class="box flex" style="padding:30px;gap:30px">
      <div style="flex:1">
        <span class="badge">tagline badge</span> <span class="mk">3</span>
        ${ln("90%","dark")}${ln("70%","dark")}${ln("95%")}${ln("80%")}
        <div class="flex" style="margin-top:16px"><span class="btn pri">Order now</span><span class="btn">Login</span><span class="mk">4</span></div>
      </div>
      ${img(200,"300px")}
    </div>
    <div class="h">How it works <span class="mk">5</span></div>
    <div class="grid g3">${[1,2,3].map(i=>`<div class="box">${img(40,"40px")}<b>${i}. Step title</b>${ln("90%")}${ln("70%")}</div>`).join("")}</div>
    <div class="h">Canteens on campus <span class="mk">6</span></div>
    <div class="grid g3">${[1,2,3].map(i=>`<div class="box flex">${img(50,"50px")}<div style="flex:1"><div class="flex between"><b>Canteen ${i}</b><span class="badge">${i===3?'Closed':'Open'}</span></div>${ln("80%")}${ln("60%")}</div></div>`).join("")}</div>
    <div class="h flex between"><span>Popular right now <span class="mk">7</span></span><span class="btn sm">See full menu →</span></div>
    <div class="grid g4">${[1,2,3,4].map(()=>itemCard()).join("")}</div>
  </div>${foot}` },

{ id:"02-login", h:820, title:"2. Login", route:"/login", sub:"Mock login. Only needed when placing an order, so browsing stays open to everyone.",
  notes:["Simple centred card, college email + password","Error message shown in red under the fields (wrong password / empty fields)","Login → goes back to where the user came from (e.g. /cart)","“Use demo account” fills the dummy credentials for the demo"],
  body:`${nav()}
  <div class="p" style="display:flex;justify-content:center;padding:40px">
    <div style="width:420px">
      <div style="text-align:center">${img(56,"56px").replace('style="','style="margin:0 auto;')}<div class="h">Welcome back</div>${ln("80%").replace('style="','style="margin:0 auto;')}</div>
      <div class="box" style="margin-top:18px">
        <div class="lbl">College email <span class="mk">1</span></div><div class="input">you@campus.edu</div>
        <div class="lbl">Password</div><div class="input">••••••••</div>
        <div style="color:var(--note);font-size:13px;margin:8px 0">! error message area <span class="mk">2</span></div>
        <span class="btn pri" style="width:100%">Login</span> <span class="mk">3</span>
        <div style="text-align:center;margin-top:10px;text-decoration:underline">Use demo account <span class="mk">4</span></div>
      </div>
    </div>
  </div>${foot}` },

{ id:"03-menu", h:960, title:"3. Menu", route:"/menu", sub:"Core screen. Find a dish fast and add it to the cart without leaving the page.",
  notes:["Search by dish name","Veg-only toggle (very common need in Indian canteens)","Filter by canteen (pills)","Filter by category: Breakfast, Meals, Snacks, Beverages, Desserts","Result count","Card states: “+ Add” → becomes − 2 + stepper once in cart","Unavailable / closed canteen → “Sold out” badge, no button","Click card → item details. Empty result → EmptyState + “Clear filters”"],
  body:`${nav("menu")}
  <div class="p">
    <div class="h" style="margin-top:0">Menu</div>${ln("40%")}
    <div class="box" style="margin-top:12px">
      <div class="flex"><div class="input" style="flex:1">Search dosa, coffee, maggi... <span class="mk">1</span></div><span>[ ] Veg only</span><span class="mk">2</span></div>
      <div style="margin-top:12px"><span class="pill on">All canteens</span><span class="pill">Main Canteen</span><span class="pill">Juice Junction</span><span class="pill">Night Bites</span><span class="mk">3</span></div>
      <div><span class="pill on">All</span><span class="pill">Breakfast</span><span class="pill">Meals</span><span class="pill">Snacks</span><span class="pill">Beverages</span><span class="pill">Desserts</span><span class="mk">4</span></div>
    </div>
    <div style="margin:12px 0;color:var(--mid);font-size:14px">16 items <span class="mk">5</span></div>
    <div class="grid g4">${itemCard()}${itemCard("qty")}${itemCard()}${itemCard("sold")}${itemCard()}${itemCard()}${itemCard()}${itemCard()}</div>
    <div class="flex" style="margin-top:8px"><span class="mk">6</span><span style="font-size:13px">card 2 = in cart</span><span class="mk">7</span><span style="font-size:13px">card 4 = sold out</span><span class="mk">8</span></div>
  </div>` },

{ id:"04-item-details", h:900, title:"4. Item details", route:"/menu/[id]", sub:"Everything about one dish before adding it.",
  notes:["Back link to menu","Big image area","Badges: veg/non-veg, category, popular","Name, price, description","Info box: canteen + location, prep time, timings","Add to cart → turns into stepper + “Go to cart”","More dishes from the same canteen (reuses MenuItemCard)"],
  body:`${nav("menu")}
  <div class="p">
    <span class="btn sm">← Back to menu</span> <span class="mk">1</span>
    <div class="flex" style="align-items:flex-start;gap:30px;margin-top:16px">
      <div style="flex:1">${img(280)}<span class="mk">2</span></div>
      <div style="flex:1">
        <span class="badge">Veg</span><span class="badge">Meals</span><span class="badge">Popular</span><span class="mk">3</span>
        <div class="h">Dish name <span class="mk">4</span></div>${ln("25%","dark")}${ln("95%")}${ln("85%")}
        <div class="box" style="margin:14px 0">${ln("80%")}${ln("60%")}${ln("70%")}<span class="mk">5</span></div>
        <span class="btn pri">+ Add to cart</span> <span class="mk">6</span>
      </div>
    </div>
    <div class="h">More from this canteen <span class="mk">7</span></div>
    <div class="grid g4">${[1,2,3,4].map(()=>itemCard()).join("")}</div>
  </div>` },

{ id:"05-cart", h:820, title:"5. Cart & checkout", route:"/cart", sub:"Review the order, choose when to pick it up, and place it.",
  notes:["Shows which canteen you are ordering from (one canteen per order)","Each row: image, name, unit price, stepper, line total, remove","Clear cart","Pickup time dropdown: ASAP / 11 AM break / 1 PM lunch / 4 PM break","Optional note for the canteen","Subtotal + packing fee = total. Pay at counter","Not logged in → button says “Login to place order” and goes to /login","Empty cart → EmptyState with “Browse menu”"],
  body:`${nav()}
  <div class="p">
    <div class="h" style="margin-top:0">Your cart</div><div style="font-size:14px;color:var(--mid)">Ordering from Main Canteen · location <span class="mk">1</span></div>
    <div class="flex" style="align-items:flex-start;gap:20px;margin-top:16px">
      <div style="flex:2">
        ${[1,2].map(i=>`<div class="box flex" style="margin-bottom:10px">${img(54,"54px")}<div style="flex:1"><b>Dish ${i}</b>${ln("30%")}</div><span class="stepper"><span>−</span><span>1</span><span>+</span></span><b>₹ total</b><span>[bin]</span>${i===1?'<span class="mk">2</span>':''}</div>`).join("")}
        <span style="text-decoration:underline;color:var(--note);font-size:14px">Clear cart</span> <span class="mk">3</span>
      </div>
      <div class="box" style="flex:1">
        <b>Order summary</b>
        <div class="lbl">Pickup time <span class="mk">4</span></div><div class="input">ASAP (~15 min) ▾</div>
        <div class="lbl">Note (optional) <span class="mk">5</span></div><div class="input" style="height:60px">less spicy...</div>
        <div style="margin:12px 0;border-top:2px solid var(--soft);padding-top:8px;font-size:14px">
          <div class="flex between"><span>Subtotal</span><span>₹ —</span></div>
          <div class="flex between"><span>Packing fee</span><span>₹ 5</span></div>
          <div class="flex between"><b>Total</b><b>₹ —</b></div> <span class="mk">6</span>
        </div>
        <span class="btn pri" style="width:100%">Place order</span> <span class="mk">7</span>
      </div>
    </div>
    <div class="box" style="margin-top:16px;border-style:dashed;text-align:center;color:var(--mid)">Empty state: [cart icon] “Your cart is empty” + [Browse menu] <span class="mk">8</span></div>
  </div>` },

{ id:"06-confirm-modal", h:720, title:"6. Confirm order (modal)", route:"/cart", sub:"A last check before the order is sent, so nobody orders by mistake.",
  notes:["Dimmed page behind","Summary: items, canteen, pickup time, total to pay","Cancel closes (also Esc / click outside)","Confirm → loading spinner “Sending your order…” → order tracking page"],
  body:`${nav()}
  <div class="p" style="height:560px">${ln("30%","dark")}${ln("50%")}${img(200)}</div>
  <div class="overlay"><span class="mk" style="position:absolute;top:90px;left:40px">1</span>
    <div class="modal">
      <div class="flex between"><b style="font-size:20px">Confirm your order</b><span>×</span></div>
      <div style="margin:14px 0;font-size:15px">2 item(s) from <b>Canteen</b><br>Pickup: <b>11:00 AM break</b><br>Total to pay at counter: <b>₹ —</b> <span class="mk">2</span></div>
      <div class="flex" style="justify-content:flex-end"><span class="btn">Cancel</span><span class="mk">3</span><span class="btn pri">Confirm order</span><span class="mk">4</span></div>
    </div>
  </div>` },

{ id:"07-order-tracking", h:860, title:"7. Order tracking", route:"/orders/[id]", sub:"Replaces standing in the queue: the student watches the status and walks over when it's ready.",
  notes:["Big order ID to show at the counter","Status tracker: Placed → Preparing → Ready (moves automatically in the demo)","Message for the current step","When Ready: “I've picked it up” button","Order details: canteen, time, pickup slot, items, note, total"],
  body:`${nav("orders")}
  <div class="p" style="max-width:700px;margin:0 auto">
    <span class="btn sm">← All orders</span>
    <div class="box" style="text-align:center;margin-top:14px">
      <div style="color:var(--mid);font-size:13px">Order ID</div><div style="font-size:30px;font-weight:bold">#CB-1234 <span class="mk">1</span></div>
      <div class="tracker"><div class="dot done">✓</div><div class="bar done"></div><div class="dot done">2</div><div class="bar"></div><div class="dot">3</div><span class="mk" style="margin-left:10px">2</span></div>
      <div class="flex" style="justify-content:space-around;font-size:13px;margin-top:-10px"><span>Placed</span><span>Preparing</span><span>Ready for pickup</span></div>
      <div style="margin:16px 0">“Your food is being prepared…” <span class="mk">3</span></div>
      <span class="btn">I've picked it up</span> <span class="mk">4</span>
    </div>
    <div class="box" style="margin-top:14px"><b>Order details</b> <span class="mk">5</span>${ln("70%")}${ln("60%")}
      ${[1,2].map(()=>`<div class="flex between">${ln("40%")}${ln("10%")}</div>`).join("")}
      <div class="flex between" style="border-top:2px solid var(--soft);padding-top:6px"><b>Total</b><b>₹ —</b></div></div>
  </div>` },

{ id:"08-my-orders", h:640, title:"8. My orders", route:"/orders", sub:"History of active and past orders.",
  notes:["Needs login. Logged out → EmptyState with Login button","One row per order: items, order ID, canteen, count, total, date","Status badge (Placed / Preparing / Ready / Picked up)","Click row → order tracking page"],
  body:`${nav("orders")}
  <div class="p">
    <div class="h" style="margin-top:0">My orders <span class="mk">1</span></div>
    ${["Preparing","Picked up","Picked up"].map((s,i)=>`<div class="box flex" style="margin-bottom:10px">${img(40,"80px")}<div style="flex:1"><b>#CB-10${i}2 · Canteen</b> ${i===0?'<span class="mk">2</span>':''}${ln("40%")}</div><span class="badge" style="font-size:13px">${s}</span>${i===0?'<span class="mk">3</span>':''}</div>`).join("")}
    <div style="font-size:14px;color:var(--note)">row = link to /orders/[id] <span class="mk">4</span></div>
  </div>` },
];

const flow = { id:"00-user-flow", h:700, title:"User flow", route:"", sub:"Main journey: discover → choose → order → wait → pick up." };
const boxes = [
  ["Landing", "/", 30, 60], ["Menu", "/menu · search & filter", 290, 60], ["Item details", "/menu/[id]", 290, 240],
  ["Cart", "/cart · pickup slot", 550, 60], ["Logged in?", "decision", 550, 240, true], ["Login", "/login", 820, 240],
  ["Confirm modal", "review order", 550, 420], ["Order tracking", "/orders/[id]", 820, 420], ["My orders", "/orders", 1080, 420],
];
const arrows = [
  [225,95,290,95,"Order now"], [385,130,385,240,"click card"], [480,270,560,140,"+ Add"], [485,95,550,95,"cart icon"],
  [645,130,645,240,"Place order"], [740,275,820,275,"no"], [915,240,740,110,"back to cart"], [645,310,645,420,"yes"],
  [740,455,820,455,"Confirm"], [1015,455,1080,455,"history"],
];
function flowSVG() {
  const a = arrows.map(([x1,y1,x2,y2,t]) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="${(x1+x2)/2+(x1===x2?40:0)}" y="${(y1+y2)/2-(x1===x2?0:10)}" text-anchor="middle" font-size="13" fill="#c2410c" stroke="#fff" stroke-width="5" paint-order="stroke" font-family="Segoe Print, Comic Sans MS">${t}</text>`).join("");
  return `<svg width="1330" height="560" style="position:absolute;left:0;top:0;z-index:2;pointer-events:none"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>${a}</svg>`;
}

const only = location.hash.slice(1);
const root = document.getElementById("root");
let html = "";
if (!only || only === flow.id) {
  html += `<section class="screen" id="${flow.id}"><h2>${flow.title} — CampusBites</h2><p class="sub">${flow.sub}</p>
    <div style="position:relative;height:560px;border:3px solid var(--ink);border-radius:10px">${flowSVG()}
    ${boxes.map(([t,s,x,y,d])=>`<div class="flowbox ${d?'decision':''}" style="left:${x}px;top:${y}px">${t}<small>${s}</small></div>`).join("")}</div></section>`;
}
screens.filter(s => !only || s.id === only).forEach(s => {
  html += `<section class="screen" id="${s.id}"><h2>${s.title} <span style="color:var(--mid);font-size:18px">${s.route}</span></h2><p class="sub">${s.sub}</p>
    <div class="row"><div class="frame">${s.body}</div><ol class="notes"><h4>Notes</h4>${s.notes.map(n=>`<li>${n}</li>`).join("")}</ol></div></section>`;
});
root.innerHTML = html;
</script>
</body>
</html>
